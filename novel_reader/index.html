<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>夜讀書閣</title>
    <link rel="shortcut icon" href="/images/favicons/favicon.ico" type="image/x-icon">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: 'var(--bg-void)',
                        panel: 'var(--bg-panel)',
                        panelHover: 'var(--bg-panel-hover)',
                        card: 'var(--bg-card)',
                        line: 'var(--line)',
                        lineSoft: 'var(--line-soft)',
                        ink: 'var(--ink)',
                        inkDim: 'var(--ink-dim)',
                        inkFaint: 'var(--ink-faint)',
                        gold: 'var(--gold)',
                        goldSoft: 'var(--gold-soft)',
                        violet: 'var(--violet)',
                        violetSoft: 'var(--violet-soft)',
                        danger: 'var(--danger)'
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        sans: ['"Noto Sans TC"', 'sans-serif']
                    }
                }
            }
        };
    </script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-void text-ink font-sans min-h-screen overflow-x-hidden">

    <div class="bg-glow"></div>

    <div class="shell relative z-[1] flex min-h-screen">
        <div class="overlay fixed inset-0 bg-black/50 z-[8] hidden" id="overlay"></div>

        <aside class="sidebar custom-scroll w-[300px] shrink-0 bg-panel border-r border-line h-screen sticky top-0 overflow-y-auto flex flex-col transition-transform duration-300" id="sidebar">
            <div class="flex items-center gap-3 px-6 py-5 border-b border-lineSoft cursor-pointer" id="brandHome">
                <div class="relative w-9 h-9 shrink-0 border border-goldSoft rounded-full flex items-center justify-center text-gold font-serif text-base">
                    <span class="absolute -inset-1.5 rounded-full border border-violetSoft opacity-50"></span>
                    <span>夜</span>
                </div>
                <div>
                    <h1 class="font-serif text-[17px] font-bold m-0 mb-0.5 tracking-wide text-ink leading-tight">夜讀書閣</h1>
                    <p class="m-0 text-[10.5px] text-inkFaint tracking-widest">NIGHT READ · PERSONAL LIBRARY</p>
                </div>
            </div>
            <div class="flex-1 px-3 pt-3.5 pb-8" id="sideBody"></div>
        </aside>

        <main class="main flex-1 min-w-0 flex flex-col">
            <div class="topbar flex items-center justify-between gap-4 px-8 py-5 border-b border-lineSoft sticky top-0 bg-[color-mix(in_srgb,var(--bg-void)_90%,transparent)] backdrop-blur z-[5]">
                <div class="topbar-left flex items-center gap-3.5 min-w-0">
                    <button class="menu-btn text-inkDim text-lg cursor-pointer p-1" id="menuBtn" aria-label="開啟目錄">
                        <i class="ph ph-list"></i>
                    </button>
                    <div class="crumb text-[12.5px] text-inkFaint whitespace-nowrap overflow-hidden text-ellipsis" id="crumb">書架</div>
                </div>
                <div class="topbar-right flex items-center gap-2.5 shrink-0" id="topbarRight"></div>
            </div>
            <div id="viewport"></div>
        </main>

    </div>

    <!-- 調整配色 floating button + modal -->
    <button class="theme-fab fixed right-5 bottom-5 z-[15] w-[46px] h-[46px] rounded-full bg-panel border border-line text-gold text-lg flex items-center justify-center cursor-pointer shadow-[0_6px_22px_rgba(0,0,0,.35)] hover:border-goldSoft hover:-translate-y-0.5 transition" id="paletteBtn" aria-label="調整配色" title="調整配色">
        <i class="ph ph-palette"></i>
    </button>

    <div class="modal-backdrop hidden fixed inset-0 z-20 bg-black/70 items-center justify-center p-5" id="themeBackdrop">
        <div class="modal w-full max-w-[460px] bg-panel border border-line rounded-2xl p-7">
            <div class="flex items-start justify-between gap-3">
                <div>
                    <h2 class="font-serif text-[19px] m-0 mb-2">調整配色</h2>
                    <p class="text-[12.5px] text-inkFaint leading-relaxed mb-4">選擇一組預設色調,或自訂強調色來打造專屬的閱讀氛圍。設定會自動儲存在此瀏覽器中。</p>
                </div>
                <button class="text-inkFaint hover:text-ink text-base cursor-pointer p-1 shrink-0" id="closeThemeBtn" aria-label="關閉">
                    <i class="ph ph-x"></i>
                </button>
            </div>

            <div class="text-[11.5px] text-inkFaint tracking-wide my-1 mb-2.5">預設色調</div>
            <div class="theme-grid grid grid-cols-3 gap-2.5 mb-5" id="themeGrid"></div>

            <div class="text-[11.5px] text-inkFaint tracking-wide mb-2.5">自訂強調色</div>
            <div class="grid grid-cols-2 gap-3.5 mb-1.5">
                <div class="flex items-center gap-2.5 bg-void border border-line rounded-lg px-2.5 py-2">
                    <label class="text-xs text-inkDim flex-1">主色</label>
                    <input type="color" class="w-[30px] h-[30px] p-0 border-none rounded-md bg-transparent cursor-pointer" id="themeGoldInput">
                </div>
                <div class="flex items-center gap-2.5 bg-void border border-line rounded-lg px-2.5 py-2">
                    <label class="text-xs text-inkDim flex-1">副色</label>
                    <input type="color" class="w-[30px] h-[30px] p-0 border-none rounded-md bg-transparent cursor-pointer" id="themeVioletInput">
                </div>
            </div>

            <div class="mt-5">
                <button class="w-full py-2.5 px-4 rounded-lg border border-line text-inkDim text-[13.5px] font-semibold cursor-pointer hover:text-ink hover:border-violetSoft transition" id="themeResetBtn">重設為預設色調</button>
            </div>
        </div>
    </div>

    <!-- 主程式邏輯（會自動讀取 books/manifest.js 及其中列出的小說檔） -->
    <script src="app.js"></script>

</body>

</html>
